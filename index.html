<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME HUB</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .balance {
      background: #1d2028;
      padding: 10px 14px;
      border-radius: 15px;
      font-weight: bold;
    }

    .welcome {
      background: linear-gradient(135deg, #6c3cff, #a45cff);
      padding: 22px;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      opacity: 0.85;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .games {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .game {
      background: #1b1d23;
      border: 1px solid #292c35;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      transition: 0.15s;
    }

    .game:active {
      transform: scale(0.96);
    }

    .game-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .game-name {
      font-size: 16px;
      font-weight: bold;
    }

    .game-desc {
      color: #9b9da5;
      font-size: 12px;
      margin-top: 5px;
    }

    .profile {
      background: #1b1d23;
      border-radius: 18px;
      padding: 18px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #6c3cff;
      margin-top: 12px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .back {
      background: #292c35;
    }

    .number {
      font-size: 45px;
      font-weight: bold;
      text-align: center;
      margin: 25px 0;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .numbers button {
      margin: 0;
      padding: 14px 5px;
      background: #292c35;
    }

    .result {
      text-align: center;
      margin-top: 18px;
      font-size: 18px;
      min-height: 25px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="home">

    <div class="header">
      <div class="logo">🎮 GAME HUB</div>
      <div class="balance">
        🪙 <span id="balance">1000</span>
      </div>
    </div>

    <div class="welcome">
      <h1>Привет! 👋</h1>
      <p>Добро пожаловать в GAME HUB</p>
    </div>

    <div class="section-title">🎮 Игры</div>

    <div class="games">

      <div class="game" onclick="openGame()">
        <div class="game-icon">🎯</div>
        <div class="game-name">Угадай число</div>
        <div class="game-desc">Угадай число от 1 до 5</div>
      </div>

      <div class="game">
        <div class="game-icon">🪙</div>
        <div class="game-name">Монетка</div>
        <div class="game-desc">Скоро</div>
      </div>

      <div class="game">
        <div class="game-icon">🧠</div>
        <div class="game-name">Викторина</div>
        <div class="game-desc">Скоро</div>
      </div>

      <div class="game">
        <div class="game-icon">🏆</div>
        <div class="game-name">Рейтинг</div>
        <div class="game-desc">Скоро</div>
      </div>

    </div>

    <div class="section-title">👤 Профиль</div>

    <div class="profile">
      <div>Игрок: <b id="username">Гость</b></div>
      <div style="margin-top:8px">
        Баланс: <b>🪙 <span id="balance2">1000</span></b>
      </div>
    </div>

  </div>


  <!-- ИГРА -->
  <div id="gameScreen" class="hidden">

    <div class="header">
      <div class="logo">🎯 Угадай число</div>
      <div class="balance">
        🪙 <span id="balance3">1000</span>
      </div>
    </div>

    <div class="welcome">
      <h1>Угадаешь? 👀</h1>
      <p>Я загадал число от 1 до 5.</p>
    </div>

    <div class="number">❓</div>

    <div class="numbers">
      <button onclick="guess(1)">1</button>
      <button onclick="guess(2)">2</button>
      <button onclick="guess(3)">3</button>
      <button onclick="guess(4)">4</button>
      <button onclick="guess(5)">5</button>
    </div>

    <div id="result" class="result"></div>

    <button onclick="openHome()" class="back">
      ← Назад
    </button>

  </div>

</div>


<script>
  // Telegram
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // Баланс
  let balance = Number(localStorage.getItem("balance")) || 1000;

  function updateBalance() {
    document.getElementById("balance").textContent = balance;
    document.getElementById("balance2").textContent = balance;
    document.getElementById("balance3").textContent = balance;

    localStorage.setItem("balance", balance);
  }

  // Имя пользователя Telegram
  if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const user = tg.initDataUnsafe.user;

    document.getElementById("username").textContent =
      user.first_name || "Игрок";
  }

  updateBalance();


  // Открыть игру
  function openGame() {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    updateBalance();
  }


  // Вернуться домой
  function openHome() {
    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");

    document.getElementById("result").textContent = "";

    updateBalance();
  }


  // Угадай число
  function guess(playerNumber) {

    if (balance < 10) {
      document.getElementById("result").textContent =
        "❌ Нужно минимум 10 🪙";

      return;
    }

    balance -= 10;

    const secret = Math.floor(Math.random() * 5) + 1;

    if (playerNumber === secret) {

      balance += 40;

      document.getElementById("result").textContent =
        "🎉 Победа! +40 🪙";

    } else {

      document.getElementById("result").textContent =
        "😢 Не угадал! Я загадал " + secret;

    }

    updateBalance();
  }
</script>

</body>
</html>
